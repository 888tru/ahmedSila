version: "2"
sql:
  - engine: postgresql
    # sqlc читает goose-миграции напрямую: схема — единственный источник правды
    schema: ./migrations
    queries: ./internal/repository/postgres/queries
    gen:
      go:
        package: sqlc
        out: ./internal/repository/sqlc
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_enum_valid_method: true
        emit_all_enum_values: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              type: "UUID"
              import: "github.com/google/uuid"
              pointer: true
          - db_type: "citext"
            go_type: "string"
          # По умолчанию pgx/v5 отдаёт pgtype.Timestamptz — с time.Time
          # маппинг в domain читается втрое короче
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "Time"
              import: "time"
              pointer: true
